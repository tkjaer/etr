name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: etr-linux-amd64
            container: ""
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: etr-linux-amd64-glibc-2.31
            container: debian:bullseye-slim
          - os: ubuntu-24.04-arm64
            goos: linux
            goarch: arm64
            name: etr-linux-arm64
            container: ""
          - os: ubuntu-24.04-arm64
            goos: linux
            goarch: arm64
            name: etr-linux-arm64-glibc-2.31
            container: debian:bullseye-slim
          - os: macos-15-intel  # Intel - macOS 15 will be the last Intel runner
            goos: darwin
            goarch: amd64
            name: etr-darwin-amd64
            container: ""
          - os: macos-latest    # Apple Silicon
            goos: darwin
            goarch: arm64
            name: etr-darwin-arm64
            container: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux' && matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Build binary (Linux, container)
        if: runner.os == 'Linux' && matrix.container != ''
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -e VERSION="$VERSION" \
            -e COMMIT="$COMMIT" \
            -e DATE="$DATE" \
            ${{ matrix.container }} \
            bash -lc '
              apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates curl git build-essential pkg-config libpcap-dev &&
              GO_MINOR=$(awk "/^go /{print \$2}" go.mod) &&
              GO_VERSION=$(curl -fsSL "https://go.dev/dl/?mode=json" | \
                grep -o "\"version\": \"go${GO_MINOR}\\.[0-9][0-9]*\"" | \
                head -n 1 | sed -E "s/.*\"go([0-9.]+)\"/\1/") &&
              ARCH=$(uname -m) &&
              case "$ARCH" in
                x86_64) GOARCH=amd64 ;;
                aarch64|arm64) GOARCH=arm64 ;;
                *) echo "Unsupported arch: $ARCH"; exit 1 ;;
              esac &&
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GOARCH}.tar.gz" -o /tmp/go.tgz &&
              tar -C /usr/local -xzf /tmp/go.tgz &&
              export PATH=/usr/local/go/bin:$PATH &&
              LDFLAGS="-X github.com/tkjaer/etr/internal/version.Version=${VERSION} \
                       -X github.com/tkjaer/etr/internal/version.GitCommit=${COMMIT} \
                       -X github.com/tkjaer/etr/internal/version.BuildDate=${DATE}" &&
              GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=1 \
                go build -buildvcs=false -ldflags="$LDFLAGS" -o ${{ matrix.name }} ./cmd/etr
            '

      - name: Build binary
        if: matrix.container == ''
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          LDFLAGS="-X github.com/tkjaer/etr/internal/version.Version=${VERSION} \
                   -X github.com/tkjaer/etr/internal/version.GitCommit=${COMMIT} \
                   -X github.com/tkjaer/etr/internal/version.BuildDate=${DATE}"

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -buildvcs=false -ldflags="${LDFLAGS}" -o ${{ matrix.name }} ./cmd/etr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          mv artifacts/etr-*/* release/
          cd release
          sha256sum etr-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
