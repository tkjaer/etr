name: Bug report
description: Report a problem with ETR
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please read [CONTRIBUTING.md](../../CONTRIBUTING.md) before filing an issue."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: command-output
    attributes:
      label: Command and output
      description: The full `etr` command and its output (redact sensitive data). For problems with hops, paths or probe results, the `-J` output of a single run (`-c 1 -P 1`) helps most.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: ETR version and OS
      description: Output of `etr -v`, plus your operating system and version.
      placeholder: "etr 1.3.0 (commit: 8e2e8f8), Ubuntu 24.04"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>How to capture</b> (for problems with hops, paths or probe results)</summary>

        `etr -B` prints the BPF filter ETR uses, so tcpdump captures only the probe traffic. Use an IP address as the destination and the same options in steps 1 and 2. Start with `-c 1 -P 1`, and only raise `-c` (probe count) or `-P` (parallel probes) if the problem doesn't show up.

        1. Start a capture:
           ```sh
           sudo tcpdump -w etr.pcap "$(etr <options> -c 1 -P 1 <destination> -B)"
           ```
        2. In another terminal, run ETR with JSON output and paste the result under "Command and output":
           ```sh
           sudo etr <options> -c 1 -P 1 -J <destination>
           ```
        3. Stop the capture (Ctrl-C), display it, and paste the result below:
           ```sh
           tcpdump -nSv -r etr.pcap
           ```

        </details>
  - type: textarea
    id: pcap
    attributes:
      label: Packet capture (optional)
      description: Output of `tcpdump -nSv -r etr.pcap` from "How to capture" above (redact sensitive data). If you're comfortable sharing it, you can also attach `etr.pcap` compressed as `.zip` or `.gz` (GitHub doesn't accept `.pcap` directly). Attachments are publicly accessible.
      render: shell
    validations:
      required: false
