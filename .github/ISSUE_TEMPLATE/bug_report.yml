name: Bug report
description: Report a problem with ETR
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please read [CONTRIBUTING.md](../../CONTRIBUTING.md) before filing an issue."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide step-by-step instructions.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Operating system and version.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ETR version
      description: Output of `etr -v`.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used
      description: Full command line used.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant output (redact sensitive data).
      render: shell
    validations:
      required: false
