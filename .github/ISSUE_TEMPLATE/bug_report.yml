name: Bug report
description: Report a problem with ETR
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please read [CONTRIBUTING.md](../../CONTRIBUTING.md) before filing an issue."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: command-output
    attributes:
      label: Command and output
      description: The full `etr` command and its output (redact sensitive data). For problems with hops, paths or probe results, the `-J` output of a single run (`-c 1 -P 1`) helps most.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: ETR version and OS
      description: Output of `etr -v`, plus your operating system and version.
      placeholder: "etr 1.3.0 (commit: 8e2e8f8), Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: pcap
    attributes:
      label: Packet capture (optional)
      description: For problems with hops, paths or probe results. Follow [Collecting a packet capture](https://github.com/tkjaer/etr/blob/main/CONTRIBUTING.md#collecting-a-packet-capture) and paste the `tcpdump -nSv -r etr.pcap` output here (redact sensitive data). If you're comfortable sharing it, you can also attach the zipped `etr.pcap`; attachments are publicly accessible.
      render: shell
    validations:
      required: false
